name: Unzip File
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check, Unzip and Delete
        run: |
          # البحث عن أي ملف zip في المستودع وفكه ثم حذفه
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f..."
              unzip -o "$f" -d .
              rm "$f"
            fi
          done

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto unzip and remove zip file"


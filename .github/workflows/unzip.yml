name: Unzip File
on:
  push:
    paths:
      - '*.zip'

# إعطاء البوت صلاحية الكتابة للمستودع
permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip file
        run: |
          unzip -o "*.zip" -d .
          rm *.zip

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto unzip file"

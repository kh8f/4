<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12503C"/>
      <stop offset="55%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#0A2E22"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DA9B"/>
      <stop offset="45%" stop-color="#E8C766"/>
      <stop offset="100%" stop-color="#B8912E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0D2"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- soft ambient glow behind the door -->
  <circle cx="256" cy="230" r="230" fill="url(#glowGrad)"/>

  <!-- vault frame -->
  <rect x="96" y="88" width="320" height="336" rx="34" fill="none" stroke="#1D5A44" stroke-width="10"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="132" fill="url(#doorGrad)"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.9"/>

  <!-- inner dial ring -->
  <circle cx="256" cy="256" r="86" fill="none" stroke="#0B3D2E" stroke-width="7" opacity="0.35"/>

  <!-- dial marks -->
  <g stroke="#0B3D2E" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="178" x2="256" y2="196"/>
    <line x1="256" y1="316" x2="256" y2="334"/>
    <line x1="178" y1="256" x2="196" y2="256"/>
    <line x1="316" y1="256" x2="334" y2="256"/>
  </g>

  <!-- dial pointer -->
  <g transform="rotate(35 256 256)">
    <rect x="248" y="196" width="16" height="60" rx="8" fill="#0B3D2E"/>
  </g>

  <!-- center hub -->
  <circle cx="256" cy="256" r="26" fill="#0B3D2E"/>
  <circle cx="256" cy="256" r="26" fill="none" stroke="#F2DA9B" stroke-width="3" opacity="0.6"/>

  <!-- small coin accent -->
  <circle cx="368" cy="378" r="34" fill="url(#ringGrad)" stroke="#0B3D2E" stroke-width="4"/>
  <circle cx="368" cy="378" r="20" fill="none" stroke="#0B3D2E" stroke-width="4" opacity="0.7"/>
  <line x1="368" y1="366" x2="368" y2="390" stroke="#0B3D2E" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="357" y1="378" x2="379" y2="378" stroke="#0B3D2E" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
